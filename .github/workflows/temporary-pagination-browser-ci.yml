name: temporary-pagination-browser-ci

on:
  push:
    branches:
      - test/pagination-browser-ci

permissions:
  contents: read

jobs:
  pagination-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Cache Blade views
        run: ./vendor/bin/testbench view:cache

      - name: Run pagination tests
        run: ./vendor/bin/pest tests/src/Support/PaginationTest.php --configuration=phpunit.sqlite.xml

      - name: Run table tests
        if: success()
        run: ./vendor/bin/pest tests/src/Tables/TableTest.php --configuration=phpunit.sqlite.xml
